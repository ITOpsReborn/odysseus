# Intel IPEX-LLM XPU overlay for native Linux Intel Arc GPU.
# Enable with:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.ipex-xpu.yml
#   RENDER_GID=<numeric output of: getent group render | cut -d: -f3>
#   IPEX_LLM_MODEL=<HuggingFace model id, e.g. Qwen/Qwen2.5-7B-Instruct>
#
# Target host: native Linux with an Intel Arc GPU (i915 DRM kernel driver).
# Device nodes /dev/dri/renderD* must exist; the Docker user must be in the
# render (and optionally video) group.
#
# This overlay differs from docker/gpu.intel.yml (which targets WSL2 via
# /dev/dxg). Use this overlay for bare-metal or native-VM Intel Arc installs.
#
# This overlay:
#   1. Passes /dev/dri through to Odysseus for Intel GPU-accelerated workloads.
#   2. Adds an ipex-llm sidecar (intel/ipex-llm-inference-xpu) that serves
#      models through an OpenAI-compatible API on port 8000.
#
# After starting the stack, set IPEX_LLM_MODEL in .env, then add the endpoint
# in Odysseus Settings -> Servers:
#   http://ipex-llm:8000/v1  (reachable within the Compose stack)
# From the host, verify the API is up:
#   curl http://localhost:8000/v1/models
#
# The ipex-llm container downloads the model from HuggingFace on first boot
# (or reads it from ./data/huggingface if already cached). Set HF_TOKEN in
# .env when the model requires authentication.
services:
  odysseus:
    devices:
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
  ipex-llm:
    image: intel/ipex-llm-inference-xpu:latest
    devices:
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${APP_DATA_DIR:-./data}/huggingface:/root/.cache/huggingface:z
    environment:
      - MODEL_PATH=${IPEX_LLM_MODEL:-}
      - IPEX_LLM_LOAD_IN_LOW_BIT=${IPEX_LLM_LOAD_IN_LOW_BIT:-sym_int4}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    restart: unless-stopped
